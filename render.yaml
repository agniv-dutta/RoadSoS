services:
  - type: web
    name: roadsos-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/seed_db.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./roadsos_prod.db
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        value: roadsos_admin_2026
      - key: CORS_ORIGINS
        value: "*"
      - key: RENDER
        value: "true"
    healthCheckPath: /api/ping
    autoDeploy: true