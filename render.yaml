services:
  - type: web
    name: roadsos-backend
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./roadsos_prod.db
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://road-sos-six.vercel.app,http://localhost:5173,http://localhost:3000
    healthCheckPath: /api/health
    autoDeploy: true